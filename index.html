<!DOCTYPE html>
<html class="dark">
<head>
    <meta charset="UTF-8">
    <title>Radio Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>body { background-color: #13131b; }</style>
</head>
<body class="p-6">
    <h1 class="text-white text-3xl font-bold mb-6">สถานีวิทยุไทย</h1>
    <div id="station-grid" class="grid grid-cols-2 md:grid-cols-4 gap-6"></div>

    <footer class="fixed bottom-0 left-0 w-full p-4 bg-gray-900 border-t border-gray-700">
        <div class="max-w-4xl mx-auto flex items-center gap-4">
            <audio id="audio-player" controls class="flex-1"></audio>
            <p id="now-playing" class="text-white font-medium">คลิกสถานีเพื่อเริ่มฟัง</p>
        </div>
    </footer>

    <script>
        const stations = [
            { "name": "COOL Fahrenheit 93 FM", "url": "https://coolism-web.cdn.byteark.com/;stream/1", "image": "https://tjradio.com/media/150px-logo/cool-fahrenheit-93.png", "type": "audio" },
            { "name": "Green Wave 106.5 FM", "url": "https://atimeonline3.smartclick.co.th/green", "image": "https://tjradio.com/media/150px-logo/green-wave-1065-fm.jpg", "type": "audio" },
            { "name": "FLEX 104.5 FM", "url": "https://streaming.flexconnect.net/voiceflex/voiceflex/playlist.m3u8", "image": "https://tjradio.com/media/150px-logo/flex-1045-fm.jpeg", "type": "hls" },
            { "name": "FM 95 ลูกทุ่งมหานคร อสมท", "url": "https://t24d2ljc.mcot.net/FM95/fm95.stream_aac/playlist.m3u8", "image": "https://tjradio.com/media/150px-logo/ltmfm95.png", "type": "hls" },
            { "name": "FM 99 Active Radio", "url": "https://uiu6f1j7.mcot.net/FM99/fm99.stream_aac/playlist.m3u8", "image": "https://tjradio.com/media/150px-logo/fm-99-active-radio.png", "type": "hls" },
            { "name": "FM 96.5 คลื่นความคิด Thinking Radio", "url": "https://live-org-01-cdn.mcot.net/radiocdn_edge/fm965.stream_aac/media-utsgikmde_272267.aac", "image": "https://tjradio.com/media/150px-logo/thinking-radio-fm-965.png", "type": "audio" }
        ];

        const grid = document.getElementById('station-grid');
        const audio = document.getElementById('audio-player');
        const nowPlaying = document.getElementById('now-playing');
        let hls;

        stations.forEach((s) => {
            const card = document.createElement('div');
            card.className = 'bg-gray-800 p-4 rounded-xl cursor-pointer hover:bg-gray-700 transition border border-gray-700';
            card.innerHTML = `<img src="${s.image}" class="rounded-lg mb-2 w-full h-32 object-cover"><h4 class="text-white text-sm font-semibold">${s.name}</h4>`;
            
            card.onclick = () => {
                nowPlaying.innerText = "กำลังเล่น: " + s.name;
                
                if (hls) hls.destroy();

                if (s.type === 'hls' && Hls.isSupported()) {
                    hls = new Hls();
                    hls.loadSource(s.url);
                    hls.attachMedia(audio);
                } else {
                    audio.src = s.url;
                }

                // สั่งเล่นพร้อมแจ้งเตือนหากเบราว์เซอร์บล็อก
                audio.play().catch(() => {
                    alert("เบราว์เซอร์บล็อกการเล่นอัตโนมัติ: โปรดกดปุ่ม Play ที่แถบสีเทาด้านล่างครับ");
                });
            };
            grid.appendChild(card);
        });
    </script>
</body>
</html>
